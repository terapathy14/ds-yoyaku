<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ドライビングシミュレータ実験の予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
/* 画面：トップ → 予約（条件・1回目・2回目・連絡先）→ 完了。予約番号から確認・変更。別に管理者の画面（予約・枠・設定・履歴）。 */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#161a24; --muted:#5d6475; --line:#d9dce5;
  --accent:#2448b8; --accent-ink:#ffffff; --chip:#e8ebf4; --chip-ink:#1e2a52;
  --ok:#137a4a; --ok-bg:#e3f4ea; --warn:#9a5b0f; --warn-bg:#fbf0dd; --bad:#b42318; --bad-bg:#fde7e5;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10131a; --surface:#181c26; --ink:#e6e9f0; --muted:#98a0b3; --line:#2b3140;
  --accent:#7d9bff; --accent-ink:#0b1022; --chip:#222a3c; --chip-ink:#d6defa;
  --ok:#5fd19a; --ok-bg:#132a1f; --warn:#e6b062; --warn-bg:#2b2213; --bad:#ff8a80; --bad-bg:#331614; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131a; --surface:#181c26; --ink:#e6e9f0; --muted:#98a0b3; --line:#2b3140;
  --accent:#7d9bff; --accent-ink:#0b1022; --chip:#222a3c; --chip-ink:#d6defa;
  --ok:#5fd19a; --ok-bg:#132a1f; --warn:#e6b062; --warn-bg:#2b2213; --bad:#ff8a80; --bad-bg:#331614; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;margin:0;font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 72px}
h1{font-weight:900;font-size:1.45rem;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:1.05rem;margin:0 0 10px;font-weight:700}
.sub{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;min-height:42px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.danger{color:var(--bad);border-color:var(--bad)}
button.link{border:none;background:none;color:var(--accent);padding:4px 0;min-height:0;text-decoration:underline}
button.big{width:100%;padding:14px;font-size:1.05rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-height:42px}
textarea{min-height:90px;resize:vertical}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
.req{color:var(--bad);font-size:.8rem;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);color:var(--chip-ink);border:1px solid transparent;border-radius:999px;padding:7px 13px;min-height:40px;line-height:1.25;text-align:center}
.chip small{display:block;font-size:.72rem;opacity:.75}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.off{opacity:.4;cursor:not-allowed}
.step{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.pick{margin-top:10px}
.sel{font-weight:700}
.note{border-radius:10px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.code{font-size:1.9rem;font-weight:900;letter-spacing:.12em}
ul.cond{margin:6px 0 10px;padding-left:1.2em}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;min-height:0;margin-top:3px;flex:none}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
dl.info dt{color:var(--muted)}
dl.info dd{margin:0}
.sess{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;background:var(--chip);color:var(--chip-ink)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border-radius:999px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:1.5rem;line-height:1.2}
.kpi span{font-size:.8rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:400;font-size:.8rem}
.scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.days label{display:flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:5px 11px;cursor:pointer}
.days input{width:16px;height:16px;min-height:0}
.dayrow{border-bottom:1px solid var(--line);padding:10px 0}
.dayrow:last-child{border-bottom:none}
.slot{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:8px;padding:2px 4px 2px 10px;margin:3px 6px 3px 0;font-size:.88rem}
.slot button{min-height:0;padding:2px 8px;border:none;background:none;color:var(--bad)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.hide{display:none!important}
.loading{text-align:center;color:var(--muted);padding:60px 0}
/* ---------- 枠のカレンダー（管理者） ---------- */
body.wide .wrap{max-width:1180px}
.cal-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cal-title{font-weight:700;font-size:1.05rem;margin-left:4px}
button.icon{min-width:42px;padding:6px 10px;font-size:1.2rem;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;min-height:40px;padding:6px 14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.cal{--half:rgba(128,130,145,.13);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cal-head,.cal-grid{display:grid;grid-template-columns:48px repeat(var(--days),minmax(0,1fr))}
.cal-head{border-bottom:1px solid var(--line)}
.cal-dh{text-align:center;padding:6px 2px 4px;border-left:1px solid var(--line);line-height:1.15}
.cal-dh .wd{font-size:.74rem;color:var(--muted)}
.cal-dh.sun .wd{color:var(--bad)}
.cal-dh.sat .wd{color:var(--accent)}
.cal-dh .dn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-weight:700;font-size:1.02rem}
.cal-dh.today .dn{background:var(--accent);color:var(--accent-ink)}
.cal-dh .cnt{display:block;font-size:.66rem;color:var(--muted);min-height:1.1em}
.cal-dh .vis{display:block;font-size:.64rem;font-weight:700;min-height:1.1em}
.cal-dh .vis.ok{color:var(--ok)}
.cal-dh .vis.no{color:var(--bad)}
.cal-body{max-height:64vh;overflow-y:auto;overscroll-behavior:contain}
.cal-times{position:relative}
.cal-times span{position:absolute;right:6px;transform:translateY(-50%);font-size:.68rem;color:var(--muted)}
.cal-col{position:relative;border-left:1px solid var(--line);cursor:crosshair;
  background:linear-gradient(to bottom,var(--line) 1px,transparent 1px) 0 0/100% var(--hh),
             linear-gradient(to bottom,var(--half) 1px,transparent 1px) 0 calc(var(--hh) / 2)/100% var(--hh)}
.cal-past{position:absolute;left:0;right:0;top:0;background:var(--half);pointer-events:none}
.cal-now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4;pointer-events:none}
.cal-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.ev{position:absolute;left:3px;right:3px;border-radius:7px;padding:3px 6px;font-size:.74rem;line-height:1.25;overflow:hidden;cursor:grab;z-index:1}
.ev.saved{background:var(--chip);color:var(--chip-ink);border:1px solid var(--accent);border-left:4px solid var(--accent)}
.ev.draft{background:var(--warn-bg);color:var(--warn);border:2px dashed var(--warn)}
.ev.past{opacity:.5;cursor:default}
.ev.dim{opacity:.25}
.ev.ghost{z-index:6;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:.95}
.ev .t{display:block;font-weight:700;white-space:nowrap;padding-right:16px}
.ev .m{display:block;opacity:.8;white-space:nowrap}
.ev .x{position:absolute;top:1px;right:1px;min-height:0;width:24px;height:24px;padding:0;border:none;border-radius:6px;background:transparent;color:inherit;font-size:1.05rem;line-height:1;opacity:0;z-index:3}
.ev:hover .x{opacity:.9}
@media (hover:none){.ev .x{opacity:.9}}
.ev .rz{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize;touch-action:none;z-index:3}
.ev .rz::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;margin-left:-11px;height:3px;border-radius:2px;background:currentColor;opacity:.4}
.bk{position:absolute;left:16px;right:6px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:.66rem;line-height:1.2;padding:2px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:2;pointer-events:none;opacity:.92}
.bk.p2{background:var(--ok);color:var(--surface)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.draftbar{position:sticky;bottom:12px;z-index:8;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;margin:0 0 14px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.draftbar button{min-height:38px}
.draftbar button.ghostbtn{background:transparent;color:var(--bg);border-color:var(--muted)}
@media (max-width:640px){.ev{font-size:.68rem;padding:2px 4px}.ev .t{white-space:normal;padding-right:18px}.bk{left:10px;right:3px}}
details.card>summary{cursor:pointer;font-weight:700}
details.card[open]>summary{margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title">実験の予約</h1>
      <p class="sub" id="subtitle">読み込み中…</p>
    </div>
    <button class="link small" id="toAdmin" style="white-space:nowrap">管理者の画面</button>
  </div>
  <div id="view"><div class="loading">読み込み中…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
var S = { view: 'home', pub: null, code: '', sel: {}, agree: false, form: {}, adm: null, tab: 'res', showPast: false, adminMode: false, busy: false };
var LS = { get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
           set: function (k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} } };
var WD = '日月火水木金土';

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('show'); }, 3200); }
// GitHub Pages に置いたときは、Apps Script の公開URL（…/exec）に POST でデータを頼む。
// Googleのログイン情報（Cookie）を送らないので、アカウントに複数ログインしていても開ける
var API_URL = 'https://script.google.com/macros/s/AKfycbx0j1oFjQsOrBNgeLMpEqbiEAVWpuvm3gLH12bheka44bCLKuENWXdXiJS9674dg4f4/exec';
var IN_GAS = !!(window.google && google.script && google.script.run);
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (!IN_GAS) {
    return fetch(API_URL, { method: 'POST', redirect: 'follow', credentials: 'omit',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (res) { if (!res.ok) throw new Error('通信に失敗しました（' + res.status + '）'); return res.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error); return j.data; });
  }
  return new Promise(function (ok, ng) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { ng(e); });
    r[fn].apply(r, args);
  });
}
function errMsg(e) { return String((e && e.message) || e).replace(/^Error:\s*/, '').replace(/^Exception:\s*/, ''); }

function min(t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; }
function hhmm(m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2); }
function dayDiff(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
function addDays(d, n) { var x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function toMs(d, t) { var p = d.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) + min(t) * 60000 - 9 * 3600000; }
function jd(d) { var x = new Date(d + 'T00:00:00Z'); return (x.getUTCMonth() + 1) + '/' + x.getUTCDate() + '（' + WD[x.getUTCDay()] + '）'; }
function jdLong(d) { var x = new Date(d + 'T00:00:00Z'); return (x.getUTCMonth() + 1) + '月' + x.getUTCDate() + '日（' + WD[x.getUTCDay()] + '）'; }
function span(t, dur) { return t + '〜' + hhmm(min(t) + dur); }
function gapOk(d1, d2) { var g = dayDiff(d1, d2), c = S.pub.cfg; return g >= c.gapMin && g <= c.gapMax; }

/* ---------- 読み込み ---------- */
function loadPublic() {
  return call('getPublic', S.code || '', S.adminMode ? LS.get('yk_pass') : '').then(function (d) { S.pub = d; head(); return d; });
}
function head() {
  var c = S.pub.cfg;
  $('title').textContent = c.title;
  document.title = c.title;
  $('subtitle').textContent = c.place;
}
function go(view) { S.view = view; render(); window.scrollTo(0, 0); }

function start() {
  var after = function (code) {
    if (code) { S.code = String(code).toUpperCase(); S.view = 'manage'; }
    loadPublic().then(render).catch(function (e) { $('view').innerHTML = '<div class="card note bad">読み込めませんでした：' + esc(errMsg(e)) + '</div>'; });
  };
  if (!IN_GAS) { after(new URLSearchParams(location.search).get('r') || ''); return; }
  try { google.script.url.getLocation(function (loc) { after(loc && loc.parameter && loc.parameter.r); }); }
  catch (e) { after(''); }
}

/* ---------- 描画 ---------- */
function render() {
  var v = $('view');
  $('toAdmin').classList.toggle('hide', S.view === 'admin');
  if (S.view === 'home') v.innerHTML = homeHtml();
  else if (S.view === 'book') v.innerHTML = bookHtml();
  else if (S.view === 'done') v.innerHTML = doneHtml();
  else if (S.view === 'lookup') v.innerHTML = lookupHtml();
  else if (S.view === 'manage') v.innerHTML = manageHtml();
  else if (S.view === 'admin') v.innerHTML = adminHtml();
  document.body.classList.toggle('wide', S.view === 'admin' && !!S.adm && S.tab === 'slots');
  if (S.view === 'admin' && S.adm && S.tab === 'slots') calAfter();
}

function infoHtml() {
  var c = S.pub.cfg;
  return '<dl class="info">' +
    '<dt>1回目</dt><dd>約' + c.dur1 + '分</dd>' +
    '<dt>2回目</dt><dd>約' + c.dur2 + '分（1回目の' + c.gapMin + (c.gapMax > c.gapMin ? '〜' + c.gapMax : '') + '日後）</dd>' +
    '<dt>場所</dt><dd>' + esc(c.place) + '</dd>' +
    '<dt>変更</dt><dd>各回の開始' + c.deadlineH + '時間前まで、この画面から変更・キャンセルできます</dd>' +
    '</dl>';
}

function homeHtml() {
  var c = S.pub.cfg;
  var n = Object.keys(S.pub.free1).length;
  return '<div class="card">' +
    (c.notice ? '<p style="margin-top:0">' + esc(c.notice) + '</p>' : '') + infoHtml() + '</div>' +
    (n ? '' : '<div class="note warn">いま予約できる日時がありません。しばらくしてから、もう一度開いてください。</div>') +
    '<button class="primary big" data-act="toBook"' + (n ? '' : ' disabled') + '>予約する</button>' +
    '<div style="height:10px"></div>' +
    '<button class="big" data-act="toLookup">予約の確認・変更・キャンセル</button>' +
    '<p class="small muted" style="margin-top:16px">問い合わせ：' + esc(c.contact) + '</p>';
}

/* 1回目・2回目の候補。lock の回は固定し、もう一方は間隔の条件に合うものだけ出す */
function options(kind) {
  var p = S.pub, sel = S.sel, out = {};
  var src = kind === 1 ? p.free1 : p.free2;
  Object.keys(src).sort().forEach(function (d) {
    var ok;
    if (kind === 1) {
      if (sel.lock2) ok = gapOk(d, sel.d2);
      else ok = Object.keys(p.free2).some(function (d2) { return gapOk(d, d2) && p.free2[d2].length; });
    } else {
      ok = !!sel.d1 && gapOk(sel.d1, d);
    }
    if (ok && src[d].length) out[d] = src[d];
  });
  return out;
}

function pickerHtml(kind) {
  var c = S.pub.cfg, sel = S.sel, dur = kind === 1 ? c.dur1 : c.dur2;
  var d = sel['d' + kind], t = sel['t' + kind];
  if (sel['lock' + kind]) {
    return '<div class="pick"><span class="sel">' + jdLong(d) + ' ' + span(t, dur) + '</span> <span class="badge warn">変更できません</span></div>';
  }
  if (kind === 2 && !sel.d1) return '<p class="muted small">先に1回目を選んでください。</p>';
  var opts = options(kind), dates = Object.keys(opts);
  if (!dates.length) {
    return '<div class="note warn">' + (kind === 2 ? 'この1回目の日程だと、2回目に選べる枠がありません。1回目を別の日にしてください。' : '選べる枠がありません。') + '</div>';
  }
  var h = '<div class="chips">';
  dates.forEach(function (x) {
    h += '<button class="chip' + (x === d ? ' on' : '') + '" data-act="pickDate" data-k="' + kind + '" data-v="' + x + '">' + jd(x) + '<small>空き ' + opts[x].length + '</small></button>';
  });
  h += '</div>';
  if (d && opts[d]) {
    h += '<p class="small muted" style="margin:12px 0 6px">' + jdLong(d) + 'の開始時刻</p><div class="chips">';
    opts[d].forEach(function (x) {
      h += '<button class="chip' + (x === t ? ' on' : '') + '" data-act="pickTime" data-k="' + kind + '" data-v="' + x + '">' + span(x, dur) + '</button>';
    });
    h += '</div>';

}

/* ---------- 枠：カレンダーで追加・移動・長さ変更 ---------- */
var CAL = { pxh: 48, snap: 15 };
function monday(d) { var w = new Date(d + 'T00:00:00Z').getUTCDay(); return addDays(d, -((w + 6) % 7)); }
function calInit() {
  if (!S.cal) {
    var n = window.innerWidth < 640 ? 3 : 7;
    S.cal = { days: n, start: n === 7 ? monday(S.adm.today) : S.adm.today, drafts: [], scroll: null, seq: 0, open: {} };
  }
  return S.cal;
}
function calDates() { var out = []; for (var i = 0; i < S.cal.days; i++) out.push(addDays(S.cal.start, i)); return out; }
function calLabel(a, b) {
  var x = a.split('-'), y = b.split('-');
  return +x[0] + '年' + (+x[1]) + '月' + (+x[2]) + '日 〜 ' + (x[1] !== y[1] ? (+y[1]) + '月' : '') + (+y[2]) + '日';
}
function fmtDur(m) { var h = Math.floor(m / 60), r = m % 60; return (h ? h + '時間' : '') + (r ? r + '分' : ''); }
function calRange(dates, ss) {
  var lo = 8 * 60, hi = 21 * 60;
  S.adm.slots.concat(S.cal.drafts).forEach(function (s) {
    if (dates.indexOf(s.date) < 0) return;
    lo = Math.min(lo, Math.floor(min(s.start) / 60) * 60); hi = Math.max(hi, Math.ceil(min(s.end) / 60) * 60);
  });
  ss.forEach(function (s) {
    if (dates.indexOf(s.d) < 0) return;
    lo = Math.min(lo, Math.floor(min(s.t) / 60) * 60); hi = Math.max(hi, Math.ceil((min(s.t) + s.dur) / 60) * 60);
  });
  return [Math.max(0, lo - 60), Math.min(24 * 60, hi + 60)];
}
function evHtml(s, kind, h0, ppm) {
  var top = (min(s.start) - h0) * ppm, ht = (min(s.end) - min(s.start)) * ppm;
  var past = toMs(s.date, s.end) <= Date.now();
  var ref = kind === 'draft' ? s.k : s.id;
  return '<div class="ev ' + kind + (past ? ' past' : '') + '" ' + (kind === 'draft' ? 'data-k' : 'data-id') + '="' + ref + '" data-d="' + s.date + '" data-s="' + s.start + '" data-e="' + s.end + '" style="top:' + top + 'px;height:' + (ht - 1) + 'px">' +
    '<span class="t">' + s.start + '–' + s.end + '</span>' +
    (ht >= 36 ? '<span class="m">' + (kind === 'draft' ? '下書き' : fmtDur(min(s.end) - min(s.start))) + '</span>' : '') +
    '<button class="x" data-act="' + (kind === 'draft' ? 'delDraft' : 'delSlot') + '" data-v="' + ref + '" aria-label="この枠を消す">×</button>' +
    (past ? '' : '<i class="rz"></i>') + '</div>';
}
function dayVis(d) {
  var a = S.adm, c = a.cfg, f1 = a.free1 || {}, f2 = a.free2 || {};
  var v = { has1: (f1[d] || []).length > 0, has2: (f2[d] || []).length > 0, ok1: false, ok2: false };
  for (var g = +c.gapMin; g <= +c.gapMax; g++) {
    if (v.has1 && (f2[addDays(d, g)] || []).length) v.ok1 = true;
    if (v.has2 && (f1[addDays(d, -g)] || []).length) v.ok2 = true;
  }

}
function visHtml(d) {

  var v = dayVis(d);

  if (v.ok1) return '<span class="vis ok">1回目可</span>';

  return '<span class="vis no">非表示</span>';
}
function hiddenNote() {
  var a = S.adm, c = a.cfg, t = a.today, seen = {}, items = [];
  a.slots.forEach(function (s) {
    var d = s.date;
    if (d < t || seen[d]) return;
    seen[d] = 1;
    var v = dayVis(d);
    if (v.ok1 || v.ok2) return;
    var from = addDays(d, +c.gapMin), to = addDays(d, +c.gapMax);
    var why = v.has1 ? '2回目用の枠が ' + jd(from) + '〜' + jd(to) + ' にないため' :
      v.has2 ? '1回目用の枠が ' + jd(addDays(d, -c.gapMax)) + '〜' + jd(addDays(d, -c.gapMin)) + ' にないため' :
      '締め切り（開始の' + c.deadlineH + '時間前）を過ぎたか、予約で埋まっているため';
    items.push('<li>' + jdLong(d) + '：' + why + (v.has1 ? ' <button class="link small" data-act="calGo" data-v="' + from + '">その日を表示</button>' : '') + '</li>');
  });
  if (!items.length) return '';

}
function admSlots() {

  var ss = sessions(true), dates = calDates(), rg = calRange(dates, ss), h0 = rg[0], h1 = rg[1], ppm = CAL.pxh / 60;
  cal.h0 = h0; cal.h1 = h1;
  var H = (h1 - h0) * ppm, now = Date.now();
  var h = '<div class="card">' +
    '<div class="cal-bar"><div class="row"><button data-act="calToday">今日</button>' +
    '<button class="icon" data-act="calMove" data-v="-1" aria-label="前へ">‹</button><button class="icon" data-act="calMove" data-v="1" aria-label="次へ">›</button>' +
    '<span class="cal-title">' + calLabel(dates[0], dates[dates.length - 1]) + '</span></div>' +
    '<div class="row"><div class="seg"><button class="' + (cal.days === 7 ? 'on' : '') + '" data-act="calDays" data-v="7">週</button><button class="' + (cal.days === 3 ? 'on' : '') + '" data-act="calDays" data-v="3">3日</button></div>' +
    '<button data-act="copyWeek">表示中の枠を翌週にコピー</button></div></div>' +
    '<p class="small muted" style="margin:0 0 8px">空いている時間を<b>ドラッグ</b>すると枠の下書きができます（クリック・タップだけなら1時間）。スマホは<b>長押ししてから</b>なぞってください。枠は<b>つかんで移動</b>、<b>下の端</b>で長さを変えられます。参加者には' + c.step + '分刻みで開始時刻が表示され、前後の人とのあいだは' + c.buffer + '分空きます。1回目の枠は、' + c.gapMin + '〜' + c.gapMax + '日後に2回目を入れられる枠があるときだけ参加者に表示されます（逆も同じ）。</p>';
  h += hiddenNote();
  h += '<div class="cal" style="--days:' + cal.days + ';--hh:' + CAL.pxh + 'px">';

  }

  h += '<details class="card" id="dBulk"' + (cal.open.dBulk ? ' open' : '') + '><summary>曜日を選んでまとめて追加</summary>' +
    '<p class="small muted" style="margin-top:0">期間と曜日を決めて、同じ時間帯の枠を一度に入れます。昼休みを空けたいときは、午前と午後に分けて2回追加してください。</p>' +
    '<div class="grid2"><label class="f"><span>いつから</span><input type="date" id="s_from" value="' + addDays(t, 1) + '"></label>' +

  var byDate = {};

      byDate[d].map(function (s) { return '<span class="slot">' + s.start + '〜' + s.end + '<button data-act="delSlot" data-v="' + s.id + '" aria-label="この枠を消す">×</button></span>'; }).join('') + '</div>' +
      (bk.length ? '<div class="small muted">' + bk.map(function (s) { return span(s.t, s.dur) + ' ' + s.n + '回目 ' + esc(s.r.name); }).join('／') + '</div>' : '') + '</div>';

}
function calAfter() {
  var b = $('calBody'), cal = S.cal;
  if (!b || !cal) return;
  if (cal.scroll == null) {
    var first = null, ds = calDates();
    S.adm.slots.forEach(function (s) { if (ds.indexOf(s.date) >= 0 && (first === null || min(s.start) < first)) first = min(s.start); });
    cal.scroll = Math.max(0, ((first === null ? 9 * 60 : first) - 30 - cal.h0) * CAL.pxh / 60);
  }
  b.scrollTop = cal.scroll;
  b.addEventListener('scroll', function () { cal.scroll = b.scrollTop; });
}
function calApply(d, date, s, e) {
  var cal = S.cal;
  if (e <= s) return;
  if (toMs(date, hhmm(s)) < Date.now()) return toast('過去の時間には枠を置けません');
  var selfId = d && d.kind === 'slot' ? d.ref : null, selfK = d && d.kind === 'draft' ? d.ref : null;
  function hit(x0, x1) { return S.adm.slots.some(function (x) { return x.id !== selfId && x.date === date && min(x.start) < x1 && x0 < min(x.end); }); }
  if (hit(s, e)) return toast('登録済みの枠と重なっています。その枠を伸ばすか、ずらしてください');
  if (d && d.kind === 'slot') {
    if (date === d.d0 && s === d.s0 && e === d.e0) return;
    var out = sessions(true).filter(function (x) {
      var a0 = min(x.t), a1 = a0 + x.dur;
      return x.d === d.d0 && a0 < d.e0 && d.s0 < a1 && !(x.d === date && a0 >= s && a1 <= e);
    });
    if (out.length && !confirm('この枠に入っている予約' + out.length + '件が、変更後の枠からはみ出します。予約そのものは消えませんが、変更しますか？')) return;
    run(call('updateSlot', LS.get('yk_pass'), d.ref, date, hhmm(s), hhmm(e)), '枠を ' + hhmm(s) + '–' + hhmm(e) + ' に変更しました')
      .then(function (r) { S.adm = r; render(); });
    return;
  }
  var keep = [], ns = s, ne = e;
  cal.drafts.forEach(function (x) {
    if (x.k === selfK) return;
    if (x.date === date && min(x.start) <= ne && ns <= min(x.end)) { ns = Math.min(ns, min(x.start)); ne = Math.max(ne, min(x.end)); }
    else keep.push(x);
  });
  if (hit(ns, ne)) return toast('登録済みの枠と重なっています');
  keep.push({ k: selfK || 'n' + (++cal.seq), date: date, start: hhmm(ns), end: hhmm(ne) });
  cal.drafts = keep;
  render();
}

function keepForm() {

}
function busy(on) { S.busy = on; document.querySelectorAll('button').forEach(function (b) { if (on) b.setAttribute('data-was', b.disabled ? '1' : ''), b.disabled = true; else if (b.hasAttribute('data-was')) { b.disabled = b.getAttribute('data-was') === '1'; b.removeAttribute('data-was'); } }); }
function run(p, okMsg) {
  busy(true);
  return p.then(function (r) { busy(false); if (okMsg) toast(okMsg); return r; })
    .catch(function (e) { busy(false); toast(errMsg(e)); throw e; });
}
function copy(text) {
  var done = function () { toast('コピーしました'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallback(); });
  else fallback();
  function fallback() { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('コピーできませんでした'); } t.remove(); }
}
function adminLoad() { return call('adminAll', LS.get('yk_pass')).then(function (d) { S.adm = d; }); }

    CFG_FIELDS.forEach(function (f) { obj[f[0]] = $('c_' + f[0]).value; });
    run(call('saveSettings', LS.get('yk_pass'), obj), '設定を保存しました').then(function (d) { S.adm = d; return loadPublic(); }).then(render);
  }
});

/* ---------- カレンダーのドラッグ操作（マウス・タッチ共通） ---------- */
var DRAG = null;
function calMinAt(col, y) { var r = col.getBoundingClientRect(); return S.cal.h0 + (y - r.top) / (CAL.pxh / 60); }
function snapF(m) { return Math.floor(m / CAL.snap) * CAL.snap; }
function snapR(m) { return Math.round(m / CAL.snap) * CAL.snap; }
function colAt(x, y) { var el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.cal-col') : null; }
function dragBegin(d) {
  d.on = true;
  var g = document.createElement('div');
  g.className = 'ev ghost ' + (d.kind === 'slot' ? 'saved' : 'draft');
  g.innerHTML = '<span class="t"></span><span class="m"></span>';
  d.g = g;
  if (d.ev) d.ev.classList.add('dim');
  d.col.appendChild(g);
  d.body = $('calBody');
  d.tick = setInterval(function () {
    if (!d.body) return;
    var r = d.body.getBoundingClientRect(), sp = 0;
    if (d.y < r.top + 28) sp = -10; else if (d.y > r.bottom - 28) sp = 10;
    if (sp) { d.body.scrollTop += sp; dragUpdate(d); }
  }, 30);
  dragUpdate(d);
}
function dragUpdate(d) {
  var lo = S.cal.h0, hi = S.cal.h1, col = d.col, s, en;
  if (d.mode === 'create') {
    var a = snapF(d.m0), b = snapF(calMinAt(col, d.y));
    s = Math.min(a, b); en = Math.max(a, b) + CAL.snap;
  } else if (d.mode === 'resize') {
    s = d.s0; en = Math.max(d.s0 + CAL.snap, snapR(calMinAt(col, d.y)));
  } else {
    var c2 = colAt(d.x, d.y);
    if (c2 && c2 !== col) { d.col = col = c2; col.appendChild(d.g); }
    var delta = snapR(calMinAt(col, d.y) - d.m0);
    s = d.s0 + delta; en = d.e0 + delta;
    if (s < lo) { en += lo - s; s = lo; }
    if (en > hi) { s -= en - hi; en = hi; }
  }
  s = Math.max(lo, s); en = Math.min(hi, en);
  d.s = s; d.e = en; d.d = col.getAttribute('data-d');
  var ppm = CAL.pxh / 60;
  d.g.style.top = (s - lo) * ppm + 'px';
  d.g.style.height = (en - s) * ppm - 1 + 'px';
  d.g.firstChild.textContent = hhmm(s) + '–' + hhmm(en);
  d.g.lastChild.textContent = fmtDur(en - s);
}
document.addEventListener('pointerdown', function (e) {
  if (S.view !== 'admin' || S.tab !== 'slots' || S.busy || DRAG || !S.cal) return;
  if (e.button !== 0) return;
  var col = e.target.closest && e.target.closest('.cal-col');
  if (!col || e.target.closest('button')) return;
  var ev = e.target.closest('.ev');
  if (ev && ev.classList.contains('past')) return;
  var mode = !ev ? 'create' : e.target.classList.contains('rz') ? 'resize' : 'move';
  var d = { mode: mode, col: col, ev: ev, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId, touch: e.pointerType !== 'mouse', on: false, m0: calMinAt(col, e.clientY) };
  if (ev) {
    d.kind = ev.getAttribute('data-id') ? 'slot' : 'draft';
    d.ref = ev.getAttribute('data-id') || ev.getAttribute('data-k');
    d.s0 = min(ev.getAttribute('data-s')); d.e0 = min(ev.getAttribute('data-e')); d.d0 = ev.getAttribute('data-d');
  } else d.kind = 'draft';
  DRAG = d;
  if (!d.touch) e.preventDefault();
  if (mode === 'resize') { e.preventDefault(); dragBegin(d); }
  else if (d.touch) d.timer = setTimeout(function () { if (DRAG === d && !d.on) { dragBegin(d); if (navigator.vibrate) navigator.vibrate(12); } }, 380);
});
document.addEventListener('pointermove', function (e) {
  var d = DRAG;
  if (!d || e.pointerId !== d.id) return;
  d.x = e.clientX; d.y = e.clientY;
  if (!d.on) {
    var moved = Math.abs(d.x - d.x0) + Math.abs(d.y - d.y0);
    if (d.touch) { if (moved > 10) { clearTimeout(d.timer); DRAG = null; } return; }
    if (moved < 5) return;
    dragBegin(d);
  }
  dragUpdate(d);
});
function dragEnd(e, cancel) {
  var d = DRAG;
  if (!d || e.pointerId !== d.id) return;
  DRAG = null; clearTimeout(d.timer); clearInterval(d.tick);
  if (d.g) d.g.remove();
  if (d.ev) d.ev.classList.remove('dim');
  if (cancel) return;
  if (!d.on) {
    if (d.mode !== 'create') return;
    var s0 = Math.floor(d.m0 / 30) * 30, e0 = Math.min(s0 + 60, S.cal.h1);
    return calApply(null, d.col.getAttribute('data-d'), s0, e0);
  }
  calApply(d.mode === 'create' ? null : d, d.d, d.s, d.e);
}
document.addEventListener('pointerup', function (e) { dragEnd(e, false); });
document.addEventListener('pointercancel', function (e) { dragEnd(e, true); });
document.addEventListener('touchmove', function (e) { if (DRAG && DRAG.on) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', function (e) { if (e.target.closest && e.target.closest('.cal')) e.preventDefault(); });
document.addEventListener('toggle', function (e) { if (S.cal && e.target && /^d(Bulk|List)$/.test(e.target.id || '')) S.cal.open[e.target.id] = e.target.open; }, true);

$('toAdmin').addEventListener('click', function () {
  S.tab = LS.get('yk_tab') || 'res';
  if (LS.get('yk_pass')) run(adminLoad()).then(function () { go('admin'); }).catch(function () { LS.set('yk_pass', ''); S.adm = null; go('admin'); });
  else { S.adm = null; go('admin'); }
});

start();
</script>
