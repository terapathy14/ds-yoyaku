<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドライビングシミュレータ実験の予約</title>
<meta name="robots" content="noindex">
<style>
/* Apps Scriptの予約ページを画面いっぱいに表示するだけのページ。上の「Google Apps Script のユーザーによって作成」の帯を出さないための入れ物 */
html, body { margin: 0; height: 100%; background: #ffffff; }
iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
</style>
</head>
<body>
<iframe id="app" title="ドライビングシミュレータ実験の予約"></iframe>
<script>
// ここに、Apps Script で公開中のURL（…/exec で終わるもの）を入れる
var APP_URL = 'https://script.google.com/macros/s/AKfycbx0j1oFjQsOrBNgeLMpEqbiEAVWpuvm3gLH12bheka44bCLKuENWXdXiJS9674dg4f4/exec';
// メールのリンク（このページのURL?r=予約番号）の予約番号を、中の予約ページに引き継ぐ
document.getElementById('app').src = APP_URL + location.search;
</script>
</body>
</html>
